name: flyingeggrushgame
description: "Flying Egg Rush"
publish_to: 'none'
version: 1.0.1+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Attribution & push — do not downgrade
  appsflyer_sdk: ^6.18.0
  app_tracking_transparency: ^2.0.6+1
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.0
  firebase_app_check: ^0.4.5
  flutter_local_notifications: ^22.0.1

  # Networking / device / storage
  connectivity_plus: ^7.1.1
  http: ^1.6.0
  device_info_plus: ^11.4.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5

  # WebView
  webview_flutter: ^4.14.1
  webview_flutter_wkwebview: ^3.22.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  ios: true
  android: true
  remove_alpha_ios: true
  image_path: "assets/icon3.png"
  adaptive_icon_background: "#7EC8E3"
  adaptive_icon_foreground: "assets/icon3.png"
